research_task:
  description: >

    Conduct comprehensive research on {topic}.

    Use the available Web Search Tool to find accurate, relevant, and recent
    information about the topic.

    Research definitions, key concepts, important facts, examples,
    applications, advantages, challenges, and recent developments.

    Prefer reliable sources and do not invent statistics or facts.

  expected_output: >
    A detailed research summary containing at least 10 well-organized
    bullet points. Include definitions, important facts, examples,
    applications, advantages, challenges, and recent developments.

  agent: researcher


writing_task:
  description: >
    Use the research produced by the Researcher to write a complete
    academic assignment about {topic}.

    The assignment must be logically organized and easy to understand.

    Include:
    - A suitable title
    - Introduction
    - Main sections with headings
    - Relevant subheadings
    - Examples where appropriate
    - Clear explanations
    - Conclusion

    Do not invent facts that are not supported by the research.

    After writing the assignment, use the Assignment File Writer tool
    to save the complete assignment as draft_assignment.md.

  expected_output: >
    A complete academic assignment in Markdown format that has been
    saved to draft_assignment.md using the Assignment File Writer tool.

    Do not use code fences.

  agent: writer


review_task:
  description: >
    Review the assignment produced by the Writer.

    Check the assignment for:
    - Grammar
    - Spelling
    - Punctuation
    - Sentence structure
    - Clarity
    - Logical flow
    - Formatting
    - Completeness
    - Proper academic structure

    Improve the assignment where necessary while preserving the original
    meaning and important information.

  expected_output: >
    A final polished academic assignment in Markdown format that is:
    - Grammatically correct
    - Clear and readable
    - Properly structured
    - Logically organized
    - Properly formatted
    - Ready for academic submission

  agent: reviewer