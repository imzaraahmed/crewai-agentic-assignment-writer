[project]
name = "ai_assignment_assistant"
version = "0.1.0"
description = "ai_assignment_assistant using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.10,<2.0.0"
]

[project.scripts]
ai_assignment_assistant = "ai_assignment_assistant.main:run"
run_crew = "ai_assignment_assistant.main:run"
train = "ai_assignment_assistant.main:train"
replay = "ai_assignment_assistant.main:replay"
test = "ai_assignment_assistant.main:test"
run_with_trigger = "ai_assignment_assistant.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
